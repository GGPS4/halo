# Copy to config.toml and change only what you need; everything else uses defaults.

[hardware]
mock = false
pump_pins = [27, 22, 23, 24, 25, 5, 6, 13]   # Halo Driver Board v1
hx711_dt = 4
hx711_sck = 17
scale_factor = 420.0      # run: python -m halo.calibrate scale
led_count = 24
led_brightness = 0.4      # keep <= 0.5; the ring is powered from the Pi's 5 V rail

[pour]
pour_oz = 1.5             # a single holds the alcohol of this much 40% spirit (a double: twice)
cup_ml = 240              # liquid that fits in your cup once it's full of ice; never poured past
glass_min_g = 60
stall_seconds = 2.0
lead_g = 2.5              # first-pour guess at what lands after a pump stops; each pump then learns its own

[bartender]
model = "claude-haiku-5-5"

[server]
port = 8080

[ui]
fullscreen = true
size = 1080
