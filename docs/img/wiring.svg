<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1210" viewBox="0 0 1800 1210" font-family="Inter, DejaVu Sans, sans-serif"><rect width="1800" height="1210" fill="#12241d"/><text x="40" y="58" font-size="34" font-weight="600" fill="#eaf2ee" font-family="DejaVu Serif, serif">Halo wiring</text><text x="40" y="88" font-size="17" fill="#9fb5ab">Everything lives in the plinth except the display (on the gate ring), the gate strip (inside the ring) and the LED ring and load cell (under the stage).</text><line x1="1090" y1="52" x2="1120" y2="52" stroke="#e5534b" stroke-width="5" stroke-linecap="round"/><text x="1128" y="58" font-size="16" fill="#eaf2ee">12 V</text><line x1="1190" y1="52" x2="1220" y2="52" stroke="#f2a33a" stroke-width="5" stroke-linecap="round"/><text x="1228" y="58" font-size="16" fill="#eaf2ee">5 V (with its ground)</text><line x1="1420" y1="52" x2="1450" y2="52" stroke="#5aa9e6" stroke-width="5" stroke-linecap="round"/><text x="1458" y="58" font-size="16" fill="#eaf2ee">Data</text><line x1="1520" y1="52" x2="1550" y2="52" stroke="#b48ead" stroke-width="5" stroke-linecap="round"/><text x="1558" y="58" font-size="16" fill="#eaf2ee">HDMI / USB</text><rect x="40" y="140" width="300" height="110" rx="16" fill="#1b3329" stroke="#e5534b" stroke-width="2"/><text x="58" y="174" font-size="22" font-weight="600" fill="#eaf2ee">12 V 6 A power brick</text><text x="58" y="202" font-size="16" fill="#9fb5ab">5.5 x 2.1 mm barrel plug</text><rect x="40" y="300" width="300" height="110" rx="16" fill="#1b3329" stroke="#e5534b" stroke-width="2"/><text x="58" y="334" font-size="22" font-weight="600" fill="#eaf2ee">Barrel inlet</text><text x="58" y="362" font-size="16" fill="#9fb5ab">Back wall of the plinth</text><text x="58" y="386" font-size="16" fill="#9fb5ab">screw-terminal adapter</text><rect x="40" y="470" width="300" height="130" rx="16" fill="#1b3329" stroke="#f2a33a" stroke-width="2"/><text x="58" y="504" font-size="22" font-weight="600" fill="#eaf2ee">5 V converter (Pi)</text><text x="58" y="532" font-size="16" fill="#9fb5ab">12 V to 5 V 5 A, USB-C out</text><text x="58" y="556" font-size="16" fill="#9fb5ab">Powers the Pi</text><rect x="40" y="660" width="300" height="130" rx="16" fill="#1b3329" stroke="#f2a33a" stroke-width="2"/><text x="58" y="694" font-size="22" font-weight="600" fill="#eaf2ee">5 V converter (LEDs)</text><text x="58" y="722" font-size="16" fill="#9fb5ab">DROK 12 V to 5 V 3 A,</text><text x="58" y="746" font-size="16" fill="#9fb5ab">wire leads</text><text x="58" y="770" font-size="16" fill="#9fb5ab">Powers the gate strip</text><path d="M 190,250 L 190,300" fill="none" stroke="#e5534b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M 340,340 L 430,340 L 430,205 L 560,205" fill="none" stroke="#e5534b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="362.2" y="257" width="175.6" height="26" rx="13" fill="#12241d" stroke="#e5534b" stroke-width="1.5"/><text x="450" y="276" font-size="14" fill="#eaf2ee" text-anchor="middle">+12 V and GND to J2</text><path d="M 190,410 L 190,470" fill="none" stroke="#e5534b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M 340,380 L 390,380 L 390,720 L 340,720" fill="none" stroke="#e5534b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="390" cy="380" r="6" fill="#e5534b"/><rect x="560" y="140" width="460" height="250" rx="16" fill="#1b3329" stroke="#5aa9e6" stroke-width="2"/><text x="578" y="174" font-size="22" font-weight="600" fill="#eaf2ee">Halo Driver Board</text><text x="578" y="202" font-size="16" fill="#9fb5ab">Stacks on the Pi through J1 (2 x 20 header)</text><text x="578" y="226" font-size="16" fill="#9fb5ab">J2   12 V in (screw terminal)</text><text x="578" y="250" font-size="16" fill="#9fb5ab">J3 to J10   pumps 1 to 8 (12 V, switched)</text><text x="578" y="274" font-size="16" fill="#9fb5ab">J11   HX711 (G, CK, DT, V)</text><text x="578" y="298" font-size="16" fill="#9fb5ab">J12   LED ring (+5V, D, G)</text><text x="578" y="322" font-size="16" fill="#9fb5ab">GPIO 27 22 23 24 25 5 6 13 drive the pumps</text><text x="578" y="346" font-size="16" fill="#9fb5ab">HX711 DT = GPIO 4, SCK = GPIO 17; LEDs = GPIO 10</text><rect x="560" y="470" width="460" height="200" rx="16" fill="#1b3329" stroke="#f2a33a" stroke-width="2"/><text x="578" y="504" font-size="22" font-weight="600" fill="#eaf2ee">Raspberry Pi 5</text><text x="578" y="532" font-size="16" fill="#9fb5ab">Driver board plugged on top (J1)</text><text x="578" y="556" font-size="16" fill="#9fb5ab">Active cooler fitted</text><text x="578" y="580" font-size="16" fill="#9fb5ab">micro-HDMI 0 to the display</text><text x="578" y="604" font-size="16" fill="#9fb5ab">USB-A to the display (touch and power)</text><path d="M 340,535 L 560,535" fill="none" stroke="#f2a33a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="404.2" y="520" width="91.60000000000001" height="26" rx="13" fill="#12241d" stroke="#f2a33a" stroke-width="1.5"/><text x="450" y="539" font-size="14" fill="#eaf2ee" text-anchor="middle">USB-C 5 V</text><path d="M 790,390 L 790,470" fill="none" stroke="#5aa9e6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="810.0" y="415" width="100.0" height="26" rx="13" fill="#12241d" stroke="#5aa9e6" stroke-width="1.5"/><text x="860" y="434" font-size="14" fill="#eaf2ee" text-anchor="middle">J1 stacked</text><rect x="1080" y="470" width="330" height="200" rx="16" fill="#1b3329" stroke="#b48ead" stroke-width="2"/><text x="1098" y="504" font-size="22" font-weight="600" fill="#eaf2ee">5 in round display</text><text x="1098" y="532" font-size="16" fill="#9fb5ab">1080 x 1080 touch</text><text x="1098" y="556" font-size="16" fill="#9fb5ab">On top of the gate ring</text><text x="1098" y="580" font-size="16" fill="#9fb5ab">Cables run up between</text><text x="1098" y="604" font-size="16" fill="#9fb5ab">the ring and the drum</text><path d="M 1020,560 L 1080,560" fill="none" stroke="#b48ead" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M 1020,620 L 1080,620" fill="none" stroke="#b48ead" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="1080" y="140" width="680" height="250" rx="16" fill="#1b3329" stroke="#e5534b" stroke-width="2"/><text x="1098" y="174" font-size="22" font-weight="600" fill="#eaf2ee">Pumps 1 to 8</text><text x="1098" y="202" font-size="16" fill="#9fb5ab">Kamoer KPHM100, 12 V. Wire + to the pin marked +.</text><text x="1098" y="226" font-size="16" fill="#9fb5ab">If one runs backwards, swap its two wires.</text><rect x="1104" y="260" width="70" height="96" rx="10" fill="#12241d" stroke="#2c4a3d" stroke-width="2"/><text x="1139" y="300" font-size="22" font-weight="600" fill="#eaf2ee" text-anchor="middle">1</text><text x="1139" y="326" font-size="13" fill="#9fb5ab" text-anchor="middle">J3</text><rect x="1186" y="260" width="70" height="96" rx="10" fill="#12241d" stroke="#2c4a3d" stroke-width="2"/><text x="1221" y="300" font-size="22" font-weight="600" fill="#eaf2ee" text-anchor="middle">2</text><text x="1221" y="326" font-size="13" fill="#9fb5ab" text-anchor="middle">J4</text><rect x="1268" y="260" width="70" height="96" rx="10" fill="#12241d" stroke="#2c4a3d" stroke-width="2"/><text x="1303" y="300" font-size="22" font-weight="600" fill="#eaf2ee" text-anchor="middle">3</text><text x="1303" y="326" font-size="13" fill="#9fb5ab" text-anchor="middle">J5</text><rect x="1350" y="260" width="70" height="96" rx="10" fill="#12241d" stroke="#2c4a3d" stroke-width="2"/><text x="1385" y="300" font-size="22" font-weight="600" fill="#eaf2ee" text-anchor="middle">4</text><text x="1385" y="326" font-size="13" fill="#9fb5ab" text-anchor="middle">J6</text><rect x="1432" y="260" width="70" height="96" rx="10" fill="#12241d" stroke="#2c4a3d" stroke-width="2"/><text x="1467" y="300" font-size="22" font-weight="600" fill="#eaf2ee" text-anchor="middle">5</text><text x="1467" y="326" font-size="13" fill="#9fb5ab" text-anchor="middle">J7</text><rect x="1514" y="260" width="70" height="96" rx="10" fill="#12241d" stroke="#2c4a3d" stroke-width="2"/><text x="1549" y="300" font-size="22" font-weight="600" fill="#eaf2ee" text-anchor="middle">6</text><text x="1549" y="326" font-size="13" fill="#9fb5ab" text-anchor="middle">J8</text><rect x="1596" y="260" width="70" height="96" rx="10" fill="#12241d" stroke="#2c4a3d" stroke-width="2"/><text x="1631" y="300" font-size="22" font-weight="600" fill="#eaf2ee" text-anchor="middle">7</text><text x="1631" y="326" font-size="13" fill="#9fb5ab" text-anchor="middle">J9</text><rect x="1678" y="260" width="70" height="96" rx="10" fill="#12241d" stroke="#2c4a3d" stroke-width="2"/><text x="1713" y="300" font-size="22" font-weight="600" fill="#eaf2ee" text-anchor="middle">8</text><text x="1713" y="326" font-size="13" fill="#9fb5ab" text-anchor="middle">J10</text><path d="M 1020,265 L 1080,265" fill="none" stroke="#e5534b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="1050" y="250" font-size="13" fill="#9fb5ab" text-anchor="middle">x8</text><rect x="560" y="760" width="300" height="150" rx="16" fill="#1b3329" stroke="#5aa9e6" stroke-width="2"/><text x="578" y="794" font-size="22" font-weight="600" fill="#eaf2ee">HX711 amplifier</text><text x="578" y="822" font-size="16" fill="#9fb5ab">G - GND</text><text x="578" y="846" font-size="16" fill="#9fb5ab">CK - SCK</text><text x="578" y="870" font-size="16" fill="#9fb5ab">DT - DT</text><text x="578" y="894" font-size="16" fill="#9fb5ab">V - VCC</text><rect x="560" y="960" width="300" height="150" rx="16" fill="#1b3329" stroke="#5aa9e6" stroke-width="2"/><text x="578" y="994" font-size="22" font-weight="600" fill="#eaf2ee">1 kg load cell</text><text x="578" y="1022" font-size="16" fill="#9fb5ab">Under the stage</text><text x="578" y="1046" font-size="16" fill="#9fb5ab">red E+, black E-</text><text x="578" y="1070" font-size="16" fill="#9fb5ab">white A-, green A+</text><path d="M 700,390 L 700,430 L 530,430 L 530,835 L 560,835" fill="none" stroke="#5aa9e6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="463.2" y="745" width="133.60000000000002" height="26" rx="13" fill="#12241d" stroke="#5aa9e6" stroke-width="1.5"/><text x="530" y="764" font-size="14" fill="#eaf2ee" text-anchor="middle">J11  G CK DT V</text><path d="M 710,910 L 710,960" fill="none" stroke="#5aa9e6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="752.6" y="920" width="74.80000000000001" height="26" rx="13" fill="#12241d" stroke="#5aa9e6" stroke-width="1.5"/><text x="790" y="939" font-size="14" fill="#eaf2ee" text-anchor="middle">4 wires</text><rect x="1080" y="760" width="330" height="150" rx="16" fill="#1b3329" stroke="#5aa9e6" stroke-width="2"/><text x="1098" y="794" font-size="22" font-weight="600" fill="#eaf2ee">24-LED ring</text><text x="1098" y="822" font-size="16" fill="#9fb5ab">Under the frosted stage</text><text x="1098" y="846" font-size="16" fill="#9fb5ab">DIN from J12, +5V, GND</text><text x="1098" y="870" font-size="16" fill="#9fb5ab">DOUT continues to the strip</text><rect x="1440" y="760" width="320" height="150" rx="16" fill="#1b3329" stroke="#5aa9e6" stroke-width="2"/><text x="1458" y="794" font-size="22" font-weight="600" fill="#eaf2ee">Gate strip, 52 LEDs</text><text x="1458" y="822" font-size="16" fill="#9fb5ab">Inside the gate ring</text><text x="1458" y="846" font-size="16" fill="#9fb5ab">DIN from the ring's DOUT</text><text x="1458" y="870" font-size="16" fill="#9fb5ab">5 V and GND from the</text><text x="1458" y="894" font-size="16" fill="#9fb5ab">LED converter</text><path d="M 1000,390 L 1000,430 L 1050,430 L 1050,830 L 1080,830" fill="none" stroke="#5aa9e6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="991.6" y="705" width="116.80000000000001" height="26" rx="13" fill="#12241d" stroke="#5aa9e6" stroke-width="1.5"/><text x="1050" y="724" font-size="14" fill="#eaf2ee" text-anchor="middle">J12  +5V D G</text><path d="M 1410,835 L 1440,835" fill="none" stroke="#5aa9e6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="1425" y="748" font-size="13" fill="#9fb5ab" text-anchor="middle">ring DOUT to strip DIN</text><path d="M 340,760 L 380,760 L 380,1140 L 1600,1140 L 1600,910" fill="none" stroke="#f2a33a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="870.2" y="1125" width="259.6" height="26" rx="13" fill="#12241d" stroke="#f2a33a" stroke-width="1.5"/><text x="1000" y="1144" font-size="14" fill="#eaf2ee" text-anchor="middle">5 V and GND to the gate strip</text><text x="40" y="1190" font-size="15" fill="#9fb5ab">All grounds are common: the board, Pi, both converters, the LED ring and the gate strip share GND. The board has no reverse-polarity protection, so check + and - at J2 before powering up.</text></svg>